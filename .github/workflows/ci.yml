# filo CI: on every push/PR, build frontend and backend and run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend dependencies
        run: npm ci

      - name: Frontend tests (re-anchoring, bundles, paths)
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Backend tests (encoding)
        run: cargo test --manifest-path src-tauri/Cargo.toml
